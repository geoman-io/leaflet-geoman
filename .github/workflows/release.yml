name: Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag or ref to release, for example v2.19.3
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FILE_NAME_PREFIX: geoman-io-leaflet-geoman

jobs:
  build:
    environment: release
    name: release job
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Important so we can merge branches
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set version
        id: version
        run: |
          RELEASE_REF="${{ inputs.release_ref || github.ref }}"
          RELEASE_REF="${RELEASE_REF#refs/tags/}"
          echo "tag=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_REF#v}" >> "$GITHUB_OUTPUT"

      - name: Check version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ steps.version.outputs.version }}" != "$PACKAGE_VERSION" ]; then
            echo "Tag version (${{ steps.version.outputs.tag }}) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare package
        id: pack
        run: |
          PACKAGE_FILE=$(pnpm pack | tail -n 1)
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.pack.outputs.file }}
            LICENSE

      - name: Publish to NPM
        run: pnpm publish --no-git-checks --provenance --access public

      - name: Merge changes from develop into master
        # Only run when a tag triggers the workflow
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Get version
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          # Configure git
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Ensure we have the latest refs
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/master:refs/remotes/origin/master

          # Checkout master and merge develop
          git checkout master
          #git merge origin/develop --no-edit
          git merge origin/develop -m "Merge version ${{ steps.version.outputs.version }} from develop to master"

          # Push merged changes back to master
          git push origin master
