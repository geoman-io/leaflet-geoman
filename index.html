<!DOCTYPE >
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaflet Geometry Management</title>
    <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="dist/leaflet-geoman.css" />
    <script src="./node_modules/prosthetic-hand/dist/prosthetic-hand.js"></script>
    <script src="cypress/libs/proj4-2.8.0.min.js"></script>
    <script src="cypress/libs/proj4leaflet-1.0.2.min.js"></script>

    <script async src="https://ga.jspm.io/npm:es-module-shims@2.6.2/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
      "imports": {
        "leaflet": "./node_modules/leaflet/dist/leaflet-src.js",
        "leaflet-geoman": "./dist/leaflet-geoman.js"
      }
    }
    </script>

    <script type="module">
      import L from 'leaflet';
      window.L = L;

      import Geoman from 'leaflet-geoman';
      window.Geoman = Geoman;
    </script>

    <style>
      html,
      body {
        font-family: Arial, Verdana;
        background-color: #eef1ef;
        font-size: 16px;
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .wrapper {
        width: 100%;
        height: 100%;
      }

      #map {
        height: 500px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div id="map"></div>
    </div>
  </body>
</html>
