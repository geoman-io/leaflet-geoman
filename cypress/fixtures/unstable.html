<!doctype html>
<html>
  <body>
    <div id="map" style="height: 300px"></div>
    <script type="importmap">
      { "imports": { "leaflet": "/node_modules/leaflet/dist/leaflet.js" } }
    </script>
    <script type="module">
      // ./unstable first: it alone must set Geoman up
      const unstable = await import('/dist/leaflet-geoman-unstable.js');
      const main = await import('/dist/leaflet-geoman.js');
      const L = await import('leaflet');
      window.geoman = { unstable, main, map: new L.Map('map') };
    </script>
  </body>
</html>
