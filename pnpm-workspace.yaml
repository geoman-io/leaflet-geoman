# Only resolve dependency versions that have been published for at least 7 days
minimumReleaseAge: 10080

# Dependencies allowed to run install/postinstall build scripts. pnpm blocks
# these by default for supply-chain safety.
allowBuilds:
  cypress: true
  esbuild: true

# Leaflet 2 betas are pinned exactly and tested here, so they can be used as
# soon as they are published.
minimumReleaseAgeExclude:
  - leaflet
